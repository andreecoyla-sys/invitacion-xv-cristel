<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista VIP - Mis XV Cristel Villegas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c0a0c' stroke='%23d4af73' stroke-width='4'/%3E%3Cpath d='M14 44 L10 22 L24 32 L32 16 L40 32 L54 22 L50 44 Z' fill='%23d4af73' stroke='%23f3d299' stroke-width='2'/%3E%3Cline x1='14' y1='49' x2='50' y2='49' stroke='%23f3d299' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lista.css">
</head>
<body>

  <!-- ================= PANTALLA DE LOGIN ================= -->
  <div class="login-wrapper" id="loginScreen">
    <div class="login-box">
      <h2>Acceso VIP</h2>
      <p>MIS XV • CRISTEL VILLEGAS</p>

      <form id="loginForm">
        <input 
          type="email" 
          id="adminEmail" 
          class="login-input" 
          placeholder="Correo de administrador" 
          required
        >

        <div class="password-wrap">
          <input 
            type="password" 
            id="adminPassword" 
            class="login-input" 
            placeholder="Contraseña" 
            required
          >
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">INGRESAR AL PANEL</button>
      </form>

      <div class="login-error" id="loginError">
        Correo o contraseña incorrectos.
      </div>
    </div>
  </div>

  <!-- ================= PANEL DE INVITADOS ================= -->
  <div class="container" id="panelScreen">
    <div class="top-bar">
      <button class="btn-agregar" id="btnAbrirAgregar">+ AGREGAR INVITADO</button>
      <button class="btn-logout" id="btnLogout">CERRAR SESIÓN</button>
    </div>

    <h1>Lista de Invitados VIP</h1>
    <div class="subtitle">MIS XV • CRISTEL VILLEGAS</div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="totalRegistrados">0</div>
        <div class="stat-label">REGISTRADOS</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="totalAsistieron">0</div>
        <div class="stat-label">INGRESARON</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="totalFaltan">0</div>
        <div class="stat-label">FALTAN</div>
      </div>
    </div>

    <input 
      type="text" 
      id="buscador" 
      class="search-box" 
      placeholder="Buscar por nombre o colegio..."
    >

    <div id="filtrosColegios" style="display:flex; flex-wrap:wrap; gap:8px; margin: 14px 0 18px 0;"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>NOMBRE COMPLETO</th>
            <th>PROCEDENCIA / COLEGIO</th>
            <th>CONTROL EN PUERTA</th>
            <th>ACCIÓN</th>
          </tr>
        </thead>
        <tbody id="tablaInvitados">
          <tr>
            <td colspan="4" style="text-align:center;">Cargando lista...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ================= MODAL PARA AGREGAR / EDITAR INVITADO ================= -->
  <div class="modal-overlay" id="modalAgregar">
    <div class="modal-box">
      <button class="modal-close" id="btnCerrarAgregar">&times;</button>
      <div class="modal-title">Agregar Invitado</div>
      <div class="modal-sub">REGISTRO MANUAL • PANEL VIP</div>

      <form id="formAgregarInvitado">
        <div class="form-group">
          <label for="nuevoNombre">NOMBRE COMPLETO</label>
          <input type="text" id="nuevoNombre" placeholder="Escribe nombre y apellido" required>
        </div>

        <div class="form-group">
          <label>¿ESTUDIA EN EL COLEGIO?</label>
          <div class="radio-options">
            <label class="radio-card">
              <input type="radio" name="nuevoTipo" value="colegio" checked>
              <span>Colegio</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="nuevoTipo" value="no_colegio">
              <span>No está en el colegio</span>
            </label>
          </div>
        </div>

        <div class="form-group" id="grupoNuevoColegio">
          <label for="nuevoColegio">NOMBRE DEL COLEGIO</label>
          <input type="text" id="nuevoColegio" placeholder="Escribe el nombre del colegio" required>
        </div>

        <button type="submit" class="btn-login" id="btnGuardarInvitado">GUARDAR EN LISTA</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lista.js"></script>
</body>
</html>
