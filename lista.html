<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel VIP - Mis XV Cristel Villegas</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lista.css?v=2">
</head>
<body>

  <!-- Pantalla de Acceso Protegido -->
  <div class="login-wrapper" id="loginScreen">
    <div class="login-box">
      <h2>Acceso VIP</h2>
      <p>CONTROL DE PUERTA • MIS XV</p>
      <form id="loginForm">
        <input type="email" id="adminEmail" class="login-input" placeholder="Correo de administrador" required>
        
        <div class="password-wrap">
          <input type="password" id="adminPassword" class="login-input" placeholder="Contraseña" required>
          <button type="button" class="toggle-pass" id="togglePass" title="Mostrar/Ocultar contraseña">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">INGRESAR AL PANEL</button>
        <div class="login-error" id="loginError">Correo o contraseña incorrectos.</div>
      </form>
    </div>
  </div>

  <!-- Panel Principal (oculto hasta iniciar sesión) -->
  <div class="container" id="panelScreen">
    <div class="top-bar">
      <button class="btn-logout" id="btnLogout">CERRAR SESIÓN</button>
    </div>

    <h1>Lista de Invitados VIP</h1>
    <div class="subtitle">MIS XV • CRISTEL VILLEGAS</div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="totalRegistrados">0</div>
        <div class="stat-label">REGISTRADOS</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="totalAsistieron">0</div>
        <div class="stat-label">EN LA FIESTA</div>
      </div>
    </div>

    <input type="text" id="buscador" class="search-box" placeholder="Buscar por nombre o colegio...">

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>NOMBRE COMPLETO</th>
            <th>COLEGIO / PROCEDENCIA</th>
            <th>ASISTENCIA</th>
            <th>ACCIÓN</th>
          </tr>
        </thead>
        <tbody id="tablaInvitados">
          <tr><td colspan="4" style="text-align:center;">Cargando lista...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lista.js?v=2"></script>
</body>
</html>
